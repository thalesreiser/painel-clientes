[project]
name = "painel-pipeline"
version = "0.1.0"
description = "Ingestion and dbt models for per-client dashboards"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=2.0.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
  "dbt-core>=1.12.7",
  "dbt-duckdb>=1.11.1",
  "faker>=40.63.0",
  "pytest>=9.2.0",
  "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
