# Gitleaks configuration (EST-02.2). Default rules plus a guard for RNF-01 (no real client CNPJs).
title = 'painel-clientes'

[extend]
useDefault = true

[[rules]]
id = 'cnpj-formatted'
description = 'CNPJ-like number (XX.XXX.XXX/XXXX-XX) outside fictional fixtures (RNF-01)'
regex = '''\b\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}\b'''
keywords = ['/']

[[rules.allowlists]]
description = 'Fictional demos and test fixtures'
paths = [
  '''(^|/)clientes/demo-[^/]+\.json$''',
  '''(^|/)(tests?|fixtures)/''',
  '''(^|/)dbt/seeds/''',
]

[[rules]]
id = 'cnpj-digits'
description = 'Bare 14-digit CNPJ next to the word "cnpj" outside fictional fixtures (RNF-01)'
# 14 digits alone are too noisy (timestamps, IDs), so the keyword must be close by.
regex = '''(?i)cnpj[^0-9\n]{0,20}\b(\d{14})\b'''
secretGroup = 1
keywords = ['cnpj']

[[rules.allowlists]]
description = 'Fictional demos and test fixtures'
paths = [
  '''(^|/)clientes/demo-[^/]+\.json$''',
  '''(^|/)(tests?|fixtures)/''',
  '''(^|/)dbt/seeds/''',
]
