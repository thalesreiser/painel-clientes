name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint PR commits
        run: >-
          npx --no-install commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --locked
      # TODO: once demo seeds/models exist, run dbt build per demo (matrix over clientes/).
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt

  demos:
    name: demos
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List demo JSON files in clientes/
        id: find
        run: |
          list=$(find clientes -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' \
            | sort | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Demos: $list"

  web:
    name: web (${{ matrix.demo }})
    needs: demos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.demos.outputs.list) }}
    env:
      CLIENTE: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install eslint .
      - run: npx --no-install prettier --check .
      - run: npm run check
      - run: npm run build

  clientes-json:
    name: clientes-json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Validate clientes/*.json against schema
        run: |
          shopt -s nullglob globstar
          schema=schemas/cliente.schema.json
          files=(clientes/**/*.json)
          if [ ! -f "$schema" ]; then
            # TODO(DAD-01.1): schema not merged yet; remove this skip once it lands.
            echo "::notice::$schema not found, skipping validation (DAD-01.1)."
            exit 0
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No JSON files in clientes/, nothing to validate."
            exit 0
          fi
          uvx --from check-jsonschema==0.33.2 check-jsonschema --schemafile "$schema" "${files[@]}"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version and checksum)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL -o "$tarball" "$base/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      # Scans the whole history reachable from the commit under test (small repo, so it is cheap).
      - name: Scan history
        run: gitleaks git --no-banner --redact --exit-code 1 --log-opts=HEAD .

  ci-ok:
    name: ci-ok
    if: always()
    needs: [commitlint, python, dbt, demos, web, clientes-json, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
